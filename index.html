<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kondisi Jembatan 2025</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* --- TAMPILAN UTAMA: MODE TERANG --- */
        :root {
            --bg: #f4f6f8;
            --header-bg: rgba(0, 94, 149, 0.9);
            --sidebar-bg: rgba(255, 255, 255, 0.85);
            --text-header: #ffffff;
            --text-sidebar: #212529;
            --accent: #005e95;
            --accent-2: #e67e22;
            --border: rgba(206, 212, 218, 0.8);
            --shadow: rgba(0, 0, 0, 0.1);
            --tab-inactive: rgba(233, 236, 239, 0.8);
            --blur: blur(12px);
            --stat-bg: rgba(0, 94, 149, 0.05);
            --stat-border: rgba(0, 94, 149, 0.2);
            --stat-alt-bg: rgba(230, 126, 34, 0.05);
            --stat-alt-border: rgba(230, 126, 34, 0.2);
        }

        /* --- TAMPILAN KEDUA: MODE GELAP (CYBER) --- */
        [data-theme="dark"] {
            --bg: #050505;
            --header-bg: rgba(10, 10, 10, 0.9);
            --sidebar-bg: rgba(17, 17, 17, 0.75);
            --text-header: #00ffff;
            --text-sidebar: #e0e0e0;
            --accent: #00ffff;
            --accent-2: #ff00ff;
            --border: rgba(51, 51, 51, 0.6);
            --shadow: rgba(0, 255, 255, 0.15);
            --tab-inactive: rgba(34, 34, 34, 0.6);
            --stat-bg: rgba(0, 255, 255, 0.05);
            --stat-border: rgba(0, 255, 255, 0.2);
            --stat-alt-bg: rgba(255, 0, 255, 0.05);
            --stat-alt-border: rgba(255, 0, 255, 0.2);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-sidebar);
            transition: background 0.3s ease, color 0.3s ease;
            overflow: hidden;
        }

        header {
            height: 55px;
            background-color: var(--header-bg);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            color: var(--text-header);
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 2px solid var(--accent);
            justify-content: space-between;
            box-shadow: 0 2px 20px var(--shadow);
            z-index: 2000;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .action-btn {
            background: transparent;
            color: var(--text-header) !important;
            border: 1px solid var(--accent);
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 10px;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .action-btn:hover {
            background: var(--accent);
            color: #000 !important;
            box-shadow: 0 0 10px var(--accent);
        }

        .main-container {
            display: flex;
            height: calc(100vh - 55px);
            width: 100%;
            position: relative;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 330px;
            background-color: var(--sidebar-bg);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            padding: 12px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
            overflow-y: auto;
            box-shadow: 4px 0 20px var(--shadow);
        }

        #map-container {
            flex-grow: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #888;
        }

        [data-theme="dark"] #map {
            background: #0a0a0a;
        }

        /* --- FLOATING REGION FILTER & SEARCH PROVINSI --- */
        .map-floating-filter {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1500;
            width: 260px;
            background: var(--sidebar-bg);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 4px 20px var(--shadow);
            overflow: hidden;
        }

        .region-header-toggle {
            width: 100%;
            padding: 8px 10px;
            background: var(--accent);
            border: none;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            font-size: 10px;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        [data-theme="dark"] .region-header-toggle {
            color: #000;
        }

        .region-header-toggle:hover {
            opacity: 0.9;
        }

        .region-dropdown-content {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: max-height 0.3s ease;
        }

        .region-dropdown-content.collapsed {
            display: none;
        }

        .search-box {
            width: 100%;
            padding: 6px 8px;
            background: var(--stat-bg);
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--text-sidebar);
            font-size: 10px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: var(--accent);
            box-shadow: 0 0 5px var(--shadow);
        }

        .region-list-container {
            max-height: 160px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-right: 2px;
        }

        .region-btn {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid var(--border);
            background: var(--stat-bg);
            color: var(--text-sidebar);
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            border-radius: 6px;
            text-align: left;
            transition: all 0.2s ease;
        }

        .region-btn:hover {
            border-color: var(--accent);
        }

        .region-btn.active {
            background: var(--accent);
            color: #fff !important;
            border-color: var(--accent);
            box-shadow: 0 0 6px var(--accent);
        }

        [data-theme="dark"] .region-btn.active {
            color: #000 !important;
        }

        /* --- STAT BOX --- */
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .stat-box {
            padding: 10px 8px;
            background: var(--stat-bg);
            border-radius: 8px;
            border: 1px solid var(--stat-border);
            text-align: center;
        }

        .stat-box.alt {
            background: var(--stat-alt-bg);
            border-color: var(--stat-alt-border);
        }

        .stat-value {
            margin: 3px 0 0 0;
            color: var(--accent);
            font-size: 1.5rem;
            font-weight: 800;
        }

        [data-theme="dark"] .stat-value {
            text-shadow: 0 0 6px var(--shadow);
        }

        .stat-box.alt .stat-value {
            color: var(--accent-2);
            font-size: 1.2rem;
        }

        .stat-label {
            opacity: 0.7;
            text-transform: uppercase;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* --- LEGENDA --- */
        .legend-container {
            padding: 8px 10px;
            background: rgba(128, 128, 128, 0.08);
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .legend-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: 10px;
            font-weight: 500;
        }

        .circle-sample {
            height: 9px;
            width: 9px;
            margin-right: 6px;
            border-radius: 50%;
        }

        /* --- STYLING LIST & SEARCH JEMBATAN --- */
        .bridge-list-container {
            padding-top: 4px;
            border-top: 1px solid var(--border);
        }

        #bridge-list {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding-right: 2px;
        }

        .bridge-item {
            padding: 7px 9px;
            background: var(--stat-bg);
            border: 1px solid var(--border);
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s ease;
        }

        .bridge-item:hover {
            border-color: var(--accent);
            background: var(--accent);
            color: #000;
        }

        .bridge-item-title {
            font-weight: bold;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bridge-item-sub {
            opacity: 0.7;
            font-size: 9.5px;
        }

        /* --- CHART DONAT --- */
        .chart-container {
            padding-top: 6px;
            border-top: 1px solid var(--border);
            height: 160px;
            display: flex;
            flex-direction: column;
        }

        /* --- POPUP LEAFLET --- */
        [data-theme="dark"] .leaflet-popup-content-wrapper,
        [data-theme="dark"] .leaflet-popup-tip {
            background: rgba(20, 20, 20, 0.9) !important;
            backdrop-filter: blur(8px);
            color: #fff !important;
            border: 1px solid var(--accent);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        .popup-title {
            font-weight: 800;
            font-size: 13px;
            color: var(--accent);
            display: block;
            border-bottom: 2px solid var(--accent);
            margin-bottom: 6px;
            padding-bottom: 4px;
            text-transform: uppercase;
        }

        .popup-table {
            width: 100%;
            font-size: 11px;
            border-collapse: collapse;
            color: inherit;
        }

        .popup-table td {
            padding: 3px 0;
            border-bottom: 1px solid rgba(128, 128, 128, 0.2);
        }

        [data-theme="dark"] .popup-table td {
            color: #ccc;
            border-bottom-color: rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                max-height: 50vh;
            }
            #map-container {
                height: 50vh;
            }
        }
    </style>
</head>

<body>

    <header>
        <span style="font-weight: 800; letter-spacing: 1px; font-size: 1rem;">DASHBOARD KONDISI JEMBATAN 2025</span>
        <div class="header-actions">
            <button class="action-btn" onclick="resetDashboard()" title="Kembali ke tampilan awal">🔄 Reset</button>
            <button class="action-btn" onclick="toggleTheme()">Theme</button>
        </div>
    </header>

    <div class="main-container">
        <!-- SIDEBAR KIRI -->
        <div class="sidebar">
            <div class="stat-grid">
                <div class="stat-box">
                    <div class="stat-label">Total Unit</div>
                    <div class="stat-value" id="total-unit">0</div>
                </div>
                <div class="stat-box alt">
                    <div class="stat-label">Total Pjg</div>
                    <div class="stat-value" id="total-length">0 m</div>
                </div>
            </div>

            <div class="legend-container">
                <h3 style="margin: 0 0 4px 0; font-size: 0.75rem; opacity: 0.8; text-transform: uppercase;">Kemantapan</h3>
                <div class="legend-grid" id="legend"></div>
            </div>

            <div class="bridge-list-container">
                <h4 style="margin: 0 0 4px 0; font-size: 0.75rem; text-transform: uppercase; opacity: 0.7;">Daftar Jembatan</h4>
                <input type="text" id="searchBridgeInput" class="search-box" placeholder="🔍 Cari nama jembatan / ruas..." onkeyup="filterBridgeList()">
                
                <div id="bridge-list">
                    <div style="font-size: 10px; opacity: 0.5; text-align: center; padding: 6px;">Pilih wilayah atau reset</div>
                </div>
            </div>

            <div class="chart-container">
                <h4 style="margin: 0 0 2px 0; font-size: 0.75rem; text-transform: uppercase; opacity: 0.6; text-align: center;">Proporsi Kemantapan</h4>
                <div style="position: relative; flex-grow: 1; min-height: 0; width: 100%;">
                    <canvas id="conditionChart"></canvas>
                </div>
            </div>
        </div>

        <!-- PETA & FLOATING FILTER + SEARCH PROVINSI -->
        <div id="map-container">
            <div class="map-floating-filter">
                <button class="region-header-toggle" onclick="toggleRegionList()">
                    <span>🗂️ Filter Provinsi</span>
                    <span id="toggle-icon">▲ Hide</span>
                </button>
                <div class="region-dropdown-content" id="region-dropdown-box">
                    <input type="text" id="searchProvInput" class="search-box" placeholder="🔍 Cari nama provinsi..." onkeyup="filterProvinsiList()">
                    
                    <div class="region-list-container" id="region-list-box">
                        <button onclick="switchRegion('nasional')" id="tab-nasional" class="region-btn">
                            🇮🇩 Seluruh Wilayah (Nasional)
                        </button>
                    </div>
                </div>
            </div>
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        let currentTheme = 'dark';
        document.documentElement.setAttribute('data-theme', 'dark');

        let activeRegion = null; 
        let myChart = null;
        let masterGeoJsonData = null; 
        let currentActiveLayer = null; 
        let lastClickedLayer = null;

        const map = L.map('map').setView([-2.5, 118.0], 5);
        const darkTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: 'CARTO' });
        const lightTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { attribution: 'CARTO' });

        if (currentTheme === 'dark') darkTiles.addTo(map);
        else lightTiles.addTo(map);

        // Palet warna untuk 5 kategori kondisi jembatan
        const colorPalette = {
            dark: { 
                'Sangat Baik': '#39ff14', // 0 & 1 (Hijau Neon)
                'Baik': '#00ffff',        // 2 (Cyan)
                'Sedang': '#fdfd96',      // 3 (Kuning)
                'Rusak': '#ff8c00',       // 4 (Oranye)
                'Rusak Berat': '#ff073a',   // 5 (Merah)
                'Tidak Diketahui': '#888888' 
            },
            light: { 
                'Sangat Baik': '#2e7d32', // 0 & 1 (Hijau Tua)
                'Baik': '#00838f',        // 2 (Cyan Gelap)
                'Sedang': '#fbc02d',      // 3 (Amber)
                'Rusak': '#ef6c00',       // 4 (Oranye Tua)
                'Rusak Berat': '#c62828',   // 5 (Merah Tua)
                'Tidak Diketahui': '#9e9e9e' 
            }
        };

        function getProp(props, targetKeys) {
            if (!props) return null;
            if (!Array.isArray(targetKeys)) targetKeys = [targetKeys];
            for (let target of targetKeys) {
                const key = Object.keys(props).find(k => k.toLowerCase() === target.toLowerCase());
                if (key && props[key] !== null && props[key] !== undefined) return props[key];
            }
            return null;
        }

        function getBridgeLength(props) {
            const pjg = getProp(props, ['Pjg_Jbt_25', 'Pjg_Jbt_26', 'Pjg_26']);
            return parseFloat(pjg) || 0;
        }

        // Logika kondisi jembatan berdasarkan nilai JBT_25 / JBT_26
        function getKondisiRaw(props) {
            const nilaiKondisi = getProp(props, ['JBT_25', 'JBT_26']);
            if (nilaiKondisi === null || nilaiKondisi === undefined || nilaiKondisi === "") return 'Tidak Diketahui';
            
            const nk = parseInt(nilaiKondisi);
            if (!isNaN(nk)) {
                if (nk === 0 || nk === 1) return 'Sangat Baik';
                if (nk === 2) return 'Baik';
                if (nk === 3) return 'Sedang';
                if (nk === 4) return 'Rusak';
                if (nk >= 5) return 'Rusak Berat';
            }
            return 'Tidak Diketahui';
        }

        function getColor(kondisiRaw, theme) {
            return colorPalette[theme][kondisiRaw] || colorPalette[theme]['Tidak Diketahui'];
        }

        function createFeatureLayer(featuresArray) {
            const featureCollection = {
                type: "FeatureCollection",
                features: featuresArray
            };

            return L.geoJSON(featureCollection, {
                pointToLayer: function (feature, latlng) {
                    const kondisi = getKondisiRaw(feature.properties);
                    const color = getColor(kondisi, currentTheme);
                    return L.circleMarker(latlng, {
                        radius: 5,
                        fillColor: color,
                        color: currentTheme === 'dark' ? '#000' : '#fff',
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.8
                    });
                },
                onEachFeature: (f, l) => {
                    const p = f.properties;
                    const nmJbt = getProp(p, ['Nm_Jbt_25', 'NM_JBT_UPD']) || 'Jembatan Tanpa Nama';
                    const nmRuas = getProp(p, ['Nm_Ruas_25', 'NM_RUAS_UP']) || '-';
                    const panjang = getBridgeLength(p);
                    const kondisi = getKondisiRaw(p);
                    const color = getColor(kondisi, currentTheme);

                    l.on('click', function (e) {
                        L.DomEvent.stopPropagation(e);
                        highlightFeature(l, color);
                    });

                    l.bindPopup(`
                        <span class="popup-title">${nmJbt}</span>
                        <table class="popup-table">
                            <tr><td><b>Ruas</b></td><td style="text-align:right">${nmRuas}</td></tr>
                            <tr><td><b>Panjang</b></td><td style="text-align:right">${panjang} m</td></tr>
                            <tr><td><b>Kondisi</b></td><td style="text-align:right; color:${color}; font-weight:bold;">${kondisi}</td></tr>
                            <tr><td><b>Provinsi</b></td><td style="text-align:right">${p.Provinsi || '-'}</td></tr>
                        </table>
                    `);
                }
            });
        }

        function highlightFeature(layerInstance, color) {
            if (currentActiveLayer) {
                currentActiveLayer.eachLayer(layer => {
                    if (layer.setStyle) {
                        layer.setStyle({ radius: 5, weight: 1, color: currentTheme === 'dark' ? '#000' : '#fff' });
                    }
                });
            }

            lastClickedLayer = layerInstance;
            layerInstance.setStyle({
                radius: 8,
                color: currentTheme === 'dark' ? '#00ffff' : '#005e95',
                weight: 2.5,
                fillColor: color
            });
            layerInstance.bringToFront();
        }

        map.on('click', function () {
            if (currentActiveLayer) {
                currentActiveLayer.eachLayer(layer => {
                    if (layer.setStyle) {
                        layer.setStyle({ radius: 5, weight: 1, color: currentTheme === 'dark' ? '#000' : '#fff' });
                    }
                });
                lastClickedLayer = null;
            }
        });

        function filterBridgeList() {
            const input = document.getElementById('searchBridgeInput').value.toLowerCase();
            const items = document.getElementsByClassName('bridge-item');

            for (let i = 0; i < items.length; i++) {
                const title = items[i].getAttribute('data-name').toLowerCase();
                const ruas = items[i].getAttribute('data-ruas').toLowerCase();

                if (title.includes(input) || ruas.includes(input)) {
                    items[i].style.display = "";
                } else {
                    items[i].style.display = "none";
                }
            }
        }

        function filterProvinsiList() {
            const input = document.getElementById('searchProvInput').value.toLowerCase();
            const buttons = document.getElementsByClassName('region-btn');

            for (let i = 0; i < buttons.length; i++) {
                const text = buttons[i].innerText.toLowerCase();
                if (text.includes(input)) {
                    buttons[i].style.display = "";
                } else {
                    buttons[i].style.display = "none";
                }
            }
        }

        function resetDashboard() {
            activeRegion = null;
            lastClickedLayer = null;
            map.setView([-2.5, 118.0], 5);

            document.querySelectorAll('.region-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('searchBridgeInput').value = '';
            document.getElementById('searchProvInput').value = '';
            filterProvinsiList();

            if (currentActiveLayer) {
                map.removeLayer(currentActiveLayer);
                currentActiveLayer = null;
            }

            document.getElementById('total-unit').innerText = '0';
            document.getElementById('total-length').innerText = '0 m';
            document.getElementById('bridge-list').innerHTML = '<div style="font-size: 10px; opacity: 0.5; text-align: center; padding: 6px;">Pilih wilayah atau reset</div>';
            document.getElementById('legend').innerHTML = '';
            
            if (myChart) myChart.destroy();
        }

        function toggleRegionList() {
            const listContainer = document.getElementById('region-dropdown-box');
            const toggleIcon = document.getElementById('toggle-icon');
            listContainer.classList.toggle('collapsed');
            toggleIcon.innerText = listContainer.classList.contains('collapsed') ? '▼ Show' : '▲ Hide';
        }

        function switchRegion(regionName) {
            if (!masterGeoJsonData) return;

            activeRegion = regionName;
            lastClickedLayer = null;
            document.getElementById('searchBridgeInput').value = '';

            document.querySelectorAll('.region-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`tab-${regionName}`);
            if (activeBtn) activeBtn.classList.add('active');

            if (currentActiveLayer) {
                map.removeLayer(currentActiveLayer);
            }

            let filteredFeatures = [];
            if (regionName === 'nasional') {
                filteredFeatures = masterGeoJsonData.features.filter(f => f.properties && f.properties.Provinsi && f.properties.Provinsi.trim() !== "");
            } else {
                filteredFeatures = masterGeoJsonData.features.filter(f => f.properties && f.properties.Provinsi === regionName);
            }

            currentActiveLayer = createFeatureLayer(filteredFeatures);
            currentActiveLayer.addTo(map);

            if (currentActiveLayer.getBounds().isValid()) {
                map.flyToBounds(currentActiveLayer.getBounds(), { padding: [50, 50], duration: 1.5 });
            }

            updateUI(filteredFeatures);
        }

        function toggleTheme() {
            currentTheme = (currentTheme === 'light') ? 'dark' : 'light';
            lastClickedLayer = null;

            if (currentTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                map.removeLayer(lightTiles); darkTiles.addTo(map);
            } else {
                document.documentElement.removeAttribute('data-theme');
                map.removeLayer(darkTiles); lightTiles.addTo(map);
            }

            if (activeRegion) {
                switchRegion(activeRegion);
            }
        }

        function updateUI(featuresArray) {
            const p = colorPalette[currentTheme];
            const shadowStyle = currentTheme === 'dark' ? 'box-shadow: 0 0 6px ' : '';

            document.getElementById('legend').innerHTML = `
                <div class="legend-item"><div class="circle-sample" style="background:${p['Sangat Baik']}; ${shadowStyle}${p['Sangat Baik']}"></div> Sangat Baik</div>
                <div class="legend-item"><div class="circle-sample" style="background:${p['Baik']}; ${shadowStyle}${p['Baik']}"></div> Baik</div>
                <div class="legend-item"><div class="circle-sample" style="background:${p['Sedang']}; ${shadowStyle}${p['Sedang']}"></div> Sedang</div>
                <div class="legend-item"><div class="circle-sample" style="background:${p['Rusak']}; ${shadowStyle}${p['Rusak']}"></div> Rusak</div>
                <div class="legend-item"><div class="circle-sample" style="background:${p['Rusak Berat']}; ${shadowStyle}${p['Rusak Berat']}"></div> Rusak Berat</div>
            `;

            let totalUnit = featuresArray.length;
            let totalLength = 0;
            let counts = { 'Sangat Baik': 0, 'Baik': 0, 'Sedang': 0, 'Rusak': 0, 'Rusak Berat': 0, 'Tidak Diketahui': 0 };
            
            // Aturan Kemantapan: 0, 1, 2 = Mantap; 3, 4, 5 = Tidak Mantap
            let mantapCount = 0;
            let tidakMantapCount = 0;

            let listHTML = '';

            let index = 0;
            featuresArray.forEach(f => {
                const props = f.properties;
                totalLength += getBridgeLength(props);
                
                const k = getKondisiRaw(props);
                counts[k] = (counts[k] || 0) + 1;

                const nilaiKondisi = parseInt(getProp(props, ['JBT_25', 'JBT_26']));
                if (!isNaN(nilaiKondisi)) {
                    if (nilaiKondisi >= 0 && nilaiKondisi <= 2) {
                        mantapCount++;
                    } else if (nilaiKondisi >= 3 && nilaiKondisi <= 5) {
                        tidakMantapCount++;
                    }
                }

                const nmJbt = getProp(props, ['Nm_Jbt_25', 'NM_JBT_UPD']) || 'Jembatan Tanpa Nama';
                const nmRuas = getProp(props, ['Nm_Ruas_25', 'NM_RUAS_UP']) || '-';

                listHTML += `
                    <div class="bridge-item" data-name="${nmJbt}" data-ruas="${nmRuas}" onclick="focusBridge(${index})">
                        <span class="bridge-item-title">${nmJbt}</span>
                        <span class="bridge-item-sub">Ruas: ${nmRuas}</span>
                    </div>
                `;
                index++;
            });

            document.getElementById('total-unit').innerText = totalUnit;
            document.getElementById('total-length').innerText = totalLength.toLocaleString('id-ID', { maximumFractionDigits: 1 }) + " m";
            document.getElementById('bridge-list').innerHTML = listHTML;

            renderChart(mantapCount, tidakMantapCount);
        }

        function focusBridge(featureIndex) {
            if (!currentActiveLayer) return;

            let counter = 0;
            currentActiveLayer.eachLayer(layer => {
                if (counter === featureIndex) {
                    const latlng = layer.getLatLng();
                    map.flyTo(latlng, 15, { duration: 1.5 });
                    layer.openPopup();

                    const kondisi = getKondisiRaw(layer.feature.properties);
                    const color = getColor(kondisi, currentTheme);
                    highlightFeature(layer, color);
                }
                counter++;
            });
        }

        function renderChart(mantap, tidakMantap) {
            const ctx = document.getElementById('conditionChart').getContext('2d');
            const labelColor = currentTheme === 'dark' ? '#e0e0e0' : '#212529';
            const borderColor = currentTheme === 'dark' ? '#111' : '#fff';

            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Mantap (0-2)', 'Tidak Mantap (3-5)'],
                    datasets: [{
                        data: [mantap, tidakMantap],
                        backgroundColor: [
                            currentTheme === 'dark' ? '#39ff14' : '#2e7d32', // Hijau untuk Mantap
                            currentTheme === 'dark' ? '#ff073a' : '#c62828'  // Merah untuk Tidak Mantap
                        ],
                        borderWidth: 2,
                        borderColor: borderColor
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '60%',
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: { color: labelColor, font: { size: 10, family: 'Segoe UI' }, boxWidth: 10 }
                        }
                    }
                }
            });
        }

        // Fungsi Load Data Paralel dari Dua Repository Berbeda (1_Indonesia & 2_Indonesia)
        async function init() {
            try {
                const fileUrls = [
                    'https://raw.githubusercontent.com/afirdiansyah/1_Indonesia/main/1_Indonesia.geojson',
                    'https://raw.githubusercontent.com/afirdiansyah/2_Indonesia/main/2_Indonesia.geojson'
                ];

                const responses = await Promise.all(fileUrls.map(url => fetch(url).catch(e => null)));
                
                let allFeatures = [];
                for (let res of responses) {
                    if (res && res.ok) {
                        const jsonData = await res.json();
                        if (jsonData.features) {
                            allFeatures = allFeatures.concat(jsonData.features);
                        }
                    }
                }

                masterGeoJsonData = {
                    type: "FeatureCollection",
                    features: allFeatures
                };

                const provinsiSet = new Set();
                masterGeoJsonData.features.forEach(f => {
                    const prov = f.properties && f.properties.Provinsi;
                    if (prov && prov.trim() !== "") {
                        provinsiSet.add(prov.trim());
                    }
                });

                const listBox = document.getElementById('region-list-box');
                provinsiSet.forEach(provName => {
                    const btn = document.createElement('button');
                    btn.className = 'region-btn';
                    btn.id = `tab-${provName}`;
                    btn.innerText = `📍 ${provName}`;
                    btn.onclick = () => switchRegion(provName);
                    listBox.appendChild(btn);
                });

            } catch (e) {
                console.error("Terjadi kesalahan saat load data:", e);
                alert("Gagal memuat data GeoJSON dari repository github 1_Indonesia atau 2_Indonesia!");
            }
        }

        init();
    </script>
</body>
