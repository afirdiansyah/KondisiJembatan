<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kondisi Jembatan 2025</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* ... existing styles ... */
        :root { --bg: #f4f6f8; --header-bg: rgba(0, 94, 149, 0.9); --sidebar-bg: rgba(255, 255, 255, 0.85); --text-header: #ffffff; --text-sidebar: #212529; --accent: #005e95; --accent-2: #e67e22; --border: rgba(206, 212, 218, 0.8); --shadow: rgba(0, 0, 0, 0.1); --tab-inactive: rgba(233, 236, 239, 0.8); --blur: blur(12px); --stat-bg: rgba(0, 94, 149, 0.05); --stat-border: rgba(0, 94, 149, 0.2); --stat-alt-bg: rgba(230, 126, 34, 0.05); --stat-alt-border: rgba(230, 126, 34, 0.2); }
        [data-theme="dark"] { --bg: #050505; --header-bg: rgba(10, 10, 10, 0.9); --sidebar-bg: rgba(17, 17, 17, 0.75); --text-header: #00ffff; --text-sidebar: #e0e0e0; --accent: #00ffff; --accent-2: #ff00ff; --border: rgba(51, 51, 51, 0.6); --shadow: rgba(0, 255, 255, 0.15); --tab-inactive: rgba(34, 34, 34, 0.6); --stat-bg: rgba(0, 255, 255, 0.05); --stat-border: rgba(0, 255, 255, 0.2); --stat-alt-bg: rgba(255, 0, 255, 0.05); --stat-alt-border: rgba(255, 0, 255, 0.2); }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg); color: var(--text-sidebar); transition: background 0.3s ease, color 0.3s ease; overflow: hidden; }
        header { height: 55px; background-color: var(--header-bg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); color: var(--text-header); display: flex; align-items: center; padding: 0 20px; border-bottom: 2px solid var(--accent); justify-content: space-between; box-shadow: 0 2px 20px var(--shadow); z-index: 2000; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .action-btn { background: transparent; color: var(--text-header) !important; border: 1px solid var(--accent); padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 10px; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; }
        .action-btn:hover { background: var(--accent); color: #000 !important; box-shadow: 0 0 10px var(--accent); }
        .main-container { display: flex; height: calc(100vh - 55px); width: 100%; position: relative; }
        .sidebar { width: 330px; background-color: var(--sidebar-bg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); padding: 12px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; z-index: 1000; overflow-y: auto; box-shadow: 4px 0 20px var(--shadow); }
        #map-container { flex-grow: 1; position: relative; }
        #map { width: 100%; height: 100%; background: #888; }
        [data-theme="dark"] #map { background: #0a0a0a; }
        .map-floating-filter { position: absolute; top: 15px; right: 15px; z-index: 1500; width: 260px; background: var(--sidebar-bg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 4px 20px var(--shadow); overflow: hidden; }
        .region-header-toggle { width: 100%; padding: 8px 10px; background: var(--accent); border: none; color: #fff; cursor: pointer; font-weight: bold; font-size: 10px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
        [data-theme="dark"] .region-header-toggle { color: #000; }
        .region-header-toggle:hover { opacity: 0.9; }
        .region-dropdown-content { padding: 8px; display: flex; flex-direction: column; gap: 6px; transition: max-height 0.3s ease; }
        .region-dropdown-content.collapsed { display: none; }
        .search-box { width: 100%; padding: 6px 8px; background: var(--stat-bg); border: 1px solid var(--border); border-radius: 5px; color: var(--text-sidebar); font-size: 10px; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
        .search-box:focus { border-color: var(--accent); box-shadow: 0 0 5px var(--shadow); }
        .region-list-container { max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding-right: 2px; }
        .region-btn { width: 100%; padding: 6px 8px; border: 1px solid var(--border); background: var(--stat-bg); color: var(--text-sidebar); cursor: pointer; font-weight: 600; font-size: 11px; border-radius: 6px; text-align: left; transition: all 0.2s ease; }
        .region-btn:hover { border-color: var(--accent); }
        .region-btn.active { background: var(--accent); color: #fff !important; border-color: var(--accent); box-shadow: 0 0 6px var(--accent); }
        [data-theme="dark"] .region-btn.active { color: #000 !important; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .stat-box { padding: 10px 8px; background: var(--stat-bg); border-radius: 8px; border: 1px solid var(--stat-border); text-align: center; }
        .stat-box.alt { background: var(--stat-alt-bg); border-color: var(--stat-alt-border); }
        .stat-value { margin: 3px 0 0 0; color: var(--accent); font-size: 1.5rem; font-weight: 800; }
        [data-theme="dark"] .stat-value { text-shadow: 0 0 6px var(--shadow); }
        .stat-box.alt .stat-value { color: var(--accent-2); font-size: 1.2rem; }
        .stat-label { opacity: 0.7; text-transform: uppercase; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; }
        .legend-container { padding: 8px 10px; background: rgba(128, 128, 128, 0.08); border-radius: 6px; border: 1px solid var(--border); }
        .legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .legend-item { display: flex; align-items: center; font-size: 10px; font-weight: 500; }
        .circle-sample { height: 9px; width: 9px; margin-right: 6px; border-radius: 50%; }
        .bridge-list-container { padding-top: 4px; border-top: 1px solid var(--border); }
        #bridge-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; padding-right: 2px; }
        .bridge-item { padding: 7px 9px; background: var(--stat-bg); border: 1px solid var(--border); border-radius: 5px; cursor: pointer; font-size: 11px; transition: all 0.2s ease; }
        .bridge-item:hover { border-color: var(--accent); background: var(--accent); color: #000; }
        .bridge-item-title { font-weight: bold; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bridge-item-sub { opacity: 0.7; font-size: 9.5px; }
        .chart-container { padding-top: 6px; border-top: 1px solid var(--border); height: 160px; display: flex; flex-direction: column; }
        [data-theme="dark"] .leaflet-popup-content-wrapper, [data-theme="dark"] .leaflet-popup-tip { background: rgba(20, 20, 20, 0.9) !important; backdrop-filter: blur(8px); color: #fff !important; border: 1px solid var(--accent); box-shadow: 0 0 15px rgba(0, 255, 255, 0.2); }
        .popup-title { font-weight: 800; font-size: 13px; color: var(--accent); display: block; border-bottom: 2px solid var(--accent); margin-bottom: 6px; padding-bottom: 4px; text-transform: uppercase; }
        .popup-table { width: 100%; font-size: 11px; border-collapse: collapse; color: inherit; }
        .popup-table td { padding: 3px 0; border-bottom: 1px solid rgba(128, 128, 128, 0.2); }
        [data-theme="dark"] .popup-table td { color: #ccc; border-bottom-color: rgba(255, 255, 255, 0.05); }
        @media (max-width: 768px) { .main-container { flex-direction: column; } .sidebar { width: 100%; height: auto; max-height: 50vh; } #map-container { height: 50vh; } }
    </style>
</head>
<body>
    <header>
        <span style="font-weight: 800; letter-spacing: 1px; font-size: 1rem;">DASHBOARD KONDISI JEMBATAN 2025</span>
        <div class="header-actions">
            <button class="action-btn" onclick="downloadDataCSV()" title="Unduh Data CSV">📥 CSV</button>
            <button class="action-btn" onclick="resetDashboard()" title="Kembali ke tampilan awal">🔄 Reset</button>
            <button class="action-btn" onclick="toggleTheme()">Theme</button>
        </div>
    </header>
    <div class="main-container">
        <div class="sidebar">
            <div class="stat-grid">
                <div class="stat-box"> <div class="stat-label">Total Unit</div> <div class="stat-value" id="total-unit">0</div> </div>
                <div class="stat-box alt"> <div class="stat-label">Total Pjg</div> <div class="stat-value" id="total-length">0 m</div> </div>
            </div>
            <div class="legend-container">
                <h3 style="margin: 0 0 4px 0; font-size: 0.75rem; opacity: 0.8; text-transform: uppercase;">Kemantapan</h3>
                <div class="legend-grid" id="legend"></div>
            </div>
            <div class="bridge-list-container">
                <h4 style="margin: 0 0 4px 0; font-size: 0.75rem; text-transform: uppercase; opacity: 0.7;">Daftar Jembatan</h4>
                <input type="text" id="searchBridgeInput" class="search-box" placeholder="🔍 Cari nama jembatan / ruas..." onkeyup="filterBridgeList()">
                <div id="bridge-list"> <div style="font-size: 10px; opacity: 0.5; text-align: center; padding: 6px;">Pilih wilayah atau reset</div> </div>
            </div>
            <div class="chart-container">
                <h4 style="margin: 0 0 2px 0; font-size: 0.75rem; text-transform: uppercase; opacity: 0.6; text-align: center;">Proporsi Kemantapan</h4>
                <div style="position: relative; flex-grow: 1; min-height: 0; width: 100%;"> <canvas id="conditionChart"></canvas> </div>
            </div>
        </div>
        <div id="map-container">
            <div class="map-floating-filter">
                <button class="region-header-toggle" onclick="toggleRegionList()"> <span>🗂️ Filter Provinsi</span> <span id="toggle-icon">▲ Hide</span> </button>
                <div class="region-dropdown-content" id="region-dropdown-box">
                    <input type="text" id="searchProvInput" class="search-box" placeholder="🔍 Cari nama provinsi..." onkeyup="filterProvinsiList()">
                    <div class="region-list-container" id="region-list-box"> <button onclick="switchRegion('nasional')" id="tab-nasional" class="region-btn"> 🇮🇩 Seluruh Wilayah (Nasional) </button> </div>
                </div>
            </div>
            <div id="map"></div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let currentTheme = 'dark';
        document.documentElement.setAttribute('data-theme', 'dark');
        let activeRegion = null; let myChart = null; let masterGeoJsonData = null; let currentActiveLayer = null; let lastClickedLayer = null; let currentFilteredFeatures = [];
        const map = L.map('map').setView([-2.5, 118.0], 5);
        const darkTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: 'CARTO' }).addTo(map);
        const lightTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { attribution: 'CARTO' });
        const colorPalette = {
            dark: { 'Sangat Baik': '#39ff14', 'Baik': '#00ffff', 'Sedang': '#fdfd96', 'Rusak': '#ff8c00', 'Rusak Berat': '#ff073a', 'Tidak Diketahui': '#888888' },
            light: { 'Sangat Baik': '#2e7d32', 'Baik': '#00838f', 'Sedang': '#fbc02d', 'Rusak': '#ef6c00', 'Rusak Berat': '#c62828', 'Tidak Diketahui': '#9e9e9e' }
        };
        function getProp(props, targetKeys) { if (!props) return null; if (!Array.isArray(targetKeys)) targetKeys = [targetKeys]; for (let target of targetKeys) { const key = Object.keys(props).find(k => k.toLowerCase() === target.toLowerCase()); if (key && props[key] !== null && props[key] !== undefined) return props[key]; } return null; }
        function getBridgeLength(props) { const pjg = getProp(props, ['Pjg_Jbt_25', 'Pjg_Jbt_26', 'Pjg_26']); return parseFloat(pjg) || 0; }
        function getKondisiRaw(props) { const nk = parseInt(getProp(props, ['JBT_25', 'JBT_26'])); if (isNaN(nk)) return 'Tidak Diketahui'; if (nk <= 1) return 'Sangat Baik'; if (nk === 2) return 'Baik'; if (nk === 3) return 'Sedang'; if (nk === 4) return 'Rusak'; return 'Rusak Berat'; }
        function getColor(kondisiRaw, theme) { return colorPalette[theme][kondisiRaw] || colorPalette[theme]['Tidak Diketahui']; }
        function downloadDataCSV() {
            if (!currentFilteredFeatures.length) { alert("Tidak ada data."); return; }
            let csv = "Nama Jembatan,Ruas,Panjang,Kondisi,Provinsi\n";
            currentFilteredFeatures.forEach(f => {
                const p = f.properties;
                csv += `${(getProp(p, ['Nm_Jbt_25', 'NM_JBT_UPD']) || 'Jembatan Tanpa Nama').replace(/,/g, '')},${(getProp(p, ['Nm_Ruas_25', 'NM_RUAS_UP']) || '-').replace(/,/g, '')},${getBridgeLength(p)},${getKondisiRaw(p)},${(p.Provinsi || '-').replace(/,/g, '')}\n`;
            });
            const link = document.createElement("a");
            link.href = encodeURI("data:text/csv;charset=utf-8," + csv);
            link.download = `data_jembatan_${activeRegion || 'nasional'}.csv`;
            link.click();
        }
        function createFeatureLayer(featuresArray) {
            return L.geoJSON({ type: "FeatureCollection", features: featuresArray }, {
                pointToLayer: (f, latlng) => L.circleMarker(latlng, { radius: 5, fillColor: getColor(getKondisiRaw(f.properties), currentTheme), color: currentTheme === 'dark' ? '#000' : '#fff', weight: 1, fillOpacity: 0.8 }),
                onEachFeature: (f, l) => l.bindPopup(`<b>${getProp(f.properties, ['Nm_Jbt_25', 'NM_JBT_UPD'])}</b><br>${getProp(f.properties, ['Nm_Ruas_25', 'NM_RUAS_UP'])}`)
            });
        }
        function updateUI(featuresArray) {
            const p = colorPalette[currentTheme];
            document.getElementById('legend').innerHTML = Object.keys(p).filter(k => k !== 'Tidak Diketahui').map(k => `<div class="legend-item"><div class="circle-sample" style="background:${p[k]}"></div> ${k}</div>`).join('');
            document.getElementById('total-unit').innerText = featuresArray.length;
            document.getElementById('total-length').innerText = featuresArray.reduce((acc, f) => acc + getBridgeLength(f.properties), 0).toFixed(1) + " m";
            
            let mantap = 0, tidakMantap = 0;
            featuresArray.forEach(f => {
                const nk = parseInt(getProp(f.properties, ['JBT_25', 'JBT_26']));
                if (!isNaN(nk)) nk <= 2 ? mantap++ : tidakMantap++;
            });
            renderChart(mantap, tidakMantap);
        }
        function renderChart(mantap, tidakMantap) {
            const ctx = document.getElementById('conditionChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, { type: 'doughnut', data: { labels: ['Mantap', 'Tidak Mantap'], datasets: [{ data: [mantap, tidakMantap], backgroundColor: [currentTheme === 'dark' ? '#39ff14' : '#2e7d32', currentTheme === 'dark' ? '#ff073a' : '#c62828'] }] } });
        }
        function switchRegion(regionName) {
            activeRegion = regionName;
            currentFilteredFeatures = regionName === 'nasional' ? masterGeoJsonData.features : masterGeoJsonData.features.filter(f => f.properties.Provinsi === regionName);
            if (currentActiveLayer) map.removeLayer(currentActiveLayer);
            currentActiveLayer = createFeatureLayer(currentFilteredFeatures).addTo(map);
            updateUI(currentFilteredFeatures);
        }
        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            map.removeLayer(currentTheme === 'dark' ? lightTiles : darkTiles);
            (currentTheme === 'dark' ? darkTiles : lightTiles).addTo(map);
            if (activeRegion) switchRegion(activeRegion);
        }
        async function init() {
            const res = await Promise.all(['https://raw.githubusercontent.com/afirdiansyah/1_Indonesia/main/1_indonesia.geojson', 'https://raw.githubusercontent.com/afirdiansyah/2_Indonesia/main/2_Indonesia.geojson'].map(u => fetch(u).then(r => r.json()).catch(e => ({features:[]}))))
            masterGeoJsonData = { type: "FeatureCollection", features: res[0].features.concat(res[1].features) };
            const provs = [...new Set(masterGeoJsonData.features.map(f => f.properties.Provinsi).filter(p => p))].sort();
            provs.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'region-btn';
                btn.innerText = `📍 ${p}`;
                btn.onclick = () => switchRegion(p);
                document.getElementById('region-list-box').appendChild(btn);
            });
        }
        init();
        function toggleRegionList() { document.getElementById('region-dropdown-box').classList.toggle('collapsed'); }
        function filterBridgeList() {}
        function filterProvinsiList() {}
        function resetDashboard() { window.location.reload(); }
    </script>
</body>
</html>
